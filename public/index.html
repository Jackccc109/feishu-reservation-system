<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>预约签到 - 顾客端</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="customer">
<div class="app">
  <!-- ========== 顶部 ========== -->
  <div class="topbar">
    <div class="topbar-brand" id="storeName">优品生活馆</div>
    <div class="topbar-addr" id="storeAddr">北京市朝阳区建国路88号</div>
    <button class="btn btn-sm btn-outline topbar-mine" onclick="showLookup()">我的预约</button>
  </div>

  <!-- 活动选择器（一店多活动时显示） -->
  <div class="all-in-one" id="activityPicker" style="display:none;"></div>

  <div class="all-in-one">

    <!-- ===== 我的预约（按手机号查询） ===== -->
    <section class="panel" id="panel-lookup" style="display:none;">
      <div class="panel-header">
        <span class="step-badge">✓</span>
        <h2>我的预约</h2>
        <span class="panel-sub">输入预约时填写的手机号查询</span>
      </div>
      <div class="panel-body">
        <div class="checkin-row">
          <input type="tel" id="lookupPhone" class="form-input checkin-input" placeholder="手机号"
            maxlength="11" inputmode="numeric" autocomplete="off" style="letter-spacing:2px;">
          <button class="btn btn-success" id="btnLookup" onclick="doLookup()">查询</button>
        </div>
        <div class="form-error" id="lookupError"></div>
        <div id="lookupResult"></div>
        <div id="contactPhoneArea2" style="text-align:center;margin-top:20px;"></div>
        <div style="text-align:center;margin-top:8px;">
          <button class="btn btn-outline" onclick="backToReserve()">返回预约</button>
        </div>
      </div>
    </section>

    <!-- ===== 预约表单 ===== -->
    <section class="panel" id="panel-reserve">
      <div class="panel-header">
        <span class="step-badge">1</span>
        <h2>到店预约</h2>
        <span class="panel-sub">选择日期时段，填写信息</span>
      </div>
      <div class="panel-body">
        <!-- 日期选择 -->
        <div class="date-picker" id="datePicker"></div>

        <!-- 时段选择 -->
        <div class="slot-picker" id="slotPicker">
          <div class="form-label">选择时段</div>
          <select class="form-input slot-select" id="slotSelect">
            <option value="">请先选择日期</option>
          </select>
        </div>

        <!-- 用户信息 -->
        <div class="user-form" id="userForm">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">姓名</label>
              <input type="text" id="inputName" class="form-input" placeholder="请输入姓名" maxlength="20">
            </div>
            <div class="form-group">
              <label class="form-label">手机号</label>
              <input type="tel" id="inputPhone" class="form-input" placeholder="请输入手机号" maxlength="11">
            </div>
            <div class="form-group">
              <label class="form-label">体验人数</label>
              <select id="inputParty" class="form-input" onchange="togglePartyOther()">
                <option value="1">1人</option><option value="2" selected>2人</option>
                <option value="3">3人</option><option value="4">4人</option>
                <option value="5">5人</option><option value="6">6人</option>
                <option value="other">其他</option>
              </select>
              <input type="number" id="inputPartyOther" class="form-input" placeholder="请填写人数" min="1" max="99" style="display:none;margin-top:6px;">
            </div>
          </div>
          <button class="btn btn-primary btn-block" id="btnReserve" onclick="doReserve()">提交预约</button>
          <div class="form-error" id="reserveError"></div>
        </div>
      </div>
    </section>

    <!-- ===== 预约成功 ===== -->
    <section class="panel" id="panel-success" style="display:none;">
      <div class="panel-header">
        <span class="step-badge done">✓</span>
        <h2>预约成功</h2>
      </div>
      <div class="panel-body">
        <div class="success-layout">
          <!-- 左侧：信息 -->
          <div class="success-info">
            <div class="info-grid info-grid-2" id="successGrid">
              <!-- JS生成 -->
            </div>

            <div class="success-code-row">
              <div class="success-code-label">预约码</div>
              <div class="success-code" id="successReserveCode">------</div>
            </div>

            <div class="success-tip" id="successTip"></div>
            <div id="otherActivities" style="margin-top:16px;"></div>
            <div id="contactPhoneArea"></div>
            <div style="text-align:center;margin-top:12px;">
              <button class="btn btn-outline btn-sm" onclick="viewMyReservation()">查看我的预约详情</button>
            </div>
          </div>
        </div>

        <div style="text-align:center;margin-top:20px;">
          <button class="btn btn-outline" onclick="resetReserve()">再次预约</button>
        </div>
      </div>
    </section>

    <!-- ===== 预约详情（扫码/链接查看，只读） ===== -->
    <section class="panel" id="panel-detail" style="display:none;">
      <div class="panel-header">
        <span class="step-badge">✓</span>
        <h2>我的预约</h2>
        <span class="panel-sub">预约信息</span>
      </div>
      <div class="panel-body">
        <div class="info-grid info-grid-2" id="detailGrid"></div>
        <div class="success-code-row" id="detailCodeRow">
          <div class="success-code-label">签到验证码</div>
          <div class="success-code" id="detailSigninCode">------</div>
        </div>
        <!-- 签到二维码（到店出示给店员核销） -->
        <div style="text-align:center;margin:16px 0;">
          <div class="success-code-label" style="margin-bottom:8px;">到店出示此码给店员核销</div>
          <img id="detailQr" src="" alt="签到二维码" class="qr-code" style="width:180px;height:180px;">
        </div>
        <div class="success-tip" id="detailStatus"></div>
        <div id="contactPhoneArea3" style="text-align:center;margin-top:20px;"></div>
        <div style="text-align:center;margin-top:8px;">
          <button class="btn btn-outline" onclick="goReservePage()">去预约</button>
        </div>
      </div>
    </section>

  </div>
</div>

<script>
/* ============ 全局状态 ============ */
let currentDate = getLocalToday();
let selectedSlot = null;
let successCode = null; // 当前预约码（成功页跳详情用）
let storeCode = new URLSearchParams(location.search).get('store') || ''; // 门店编码（扫码/链接路由）
let activityCode = new URLSearchParams(location.search).get('act') || ''; // 活动ID
let activities = []; // 门店活动列表
let storePhone = ''; // 门店联系电话

// 应用顾客页背景（活动级：图片URL / 颜色 / 渐变）
function applyBackground(bg) {
  const b = document.body;
  if (!bg) {
    b.style.background = '';
    return;
  }
  const t = String(bg).trim();
  if (/^(https?:\/\/|\/)/.test(t)) {
    b.style.background = '#f5f5f5 url(' + t + ') no-repeat center top / cover fixed';
  } else {
    b.style.background = t;
  }
}

// 联系门店电话区（底部展示，可点击拨打）
function renderContactPhone() {
  const html = storePhone
    ? `<div style="text-align:center;margin:20px auto 8px;color:#888;font-size:13px;">
        需要帮助？联系门店：<a href="tel:${escapeHtml(storePhone)}" style="color:var(--primary);font-weight:600;text-decoration:none;">${escapeHtml(storePhone)}</a>
      </div>`
    : '';
  for (const id of ['contactPhoneArea', 'contactPhoneArea2', 'contactPhoneArea3']) {
    const box = document.getElementById(id);
    if (box) box.innerHTML = html;
  }
}

// 拼接门店+活动参数
function withStore(url) {
  let u = url;
  if (storeCode) u += (u.includes('?') ? '&' : '?') + 'store=' + encodeURIComponent(storeCode);
  if (activityCode) u += (u.includes('?') ? '&' : '?') + 'act=' + encodeURIComponent(activityCode);
  return u;
}

// 本地时区日期（Asia/Shanghai），避免 UTC 错位导致凌晨选错日期
function getLocalToday() {
  return new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Shanghai',
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

/* ============ 初始化 ============ */
async function init() {
  await loadSettings();

  // 扫码/链接带 ?code= → 只读展示预约详情（顾客查看预约情况）
  const params = new URLSearchParams(location.search);
  const code = params.get('code');
  if (code && /^[A-Z0-9]{6,10}$/i.test(code)) {
    await showReservationDetail(code.toUpperCase());
    return;
  }

  buildDatePicker();
}

// 只读展示预约详情
async function showReservationDetail(code) {
  const panel = document.getElementById('panel-detail');
  const grid = document.getElementById('detailGrid');
  document.getElementById('panel-reserve').style.display = 'none';
  panel.style.display = '';
  grid.innerHTML = '<div class="info-item"><div class="info-label">加载中</div><div class="info-value">--</div></div>';
  try {
    const res = await fetch(withStore('/api/reservation/' + encodeURIComponent(code)));
    const r = await res.json();
    if (!res.ok) {
      grid.innerHTML = '<div class="info-item"><div class="info-label">提示</div><div class="info-value">' + escapeHtml(r.error || '未找到该预约') + '</div></div>';
      document.getElementById('detailCodeRow').style.display = 'none';
      return;
    }
    const statusText = { pending: '待签到', checked_in: '已签到', cancelled: '已取消' }[r.status] || r.status;
    grid.innerHTML = `
      <div class="info-item"><div class="info-label">活动</div><div class="info-value">${escapeHtml(r.activityTitle || r.storeName || '-')}</div></div>
      <div class="info-item"><div class="info-label">姓名</div><div class="info-value">${escapeHtml(r.name)}</div></div>
      <div class="info-item"><div class="info-label">人数</div><div class="info-value">${r.partySize}人</div></div>
      <div class="info-item"><div class="info-label">日期</div><div class="info-value">${escapeHtml(r.date)}</div></div>
      <div class="info-item"><div class="info-label">时段</div><div class="info-value">${escapeHtml(r.timeSlot)}</div></div>
      <div class="info-item"><div class="info-label">排队号</div><div class="info-value">第${r.queueNumber}位</div></div>
      <div class="info-item"><div class="info-label">状态</div><div class="info-value">${statusText}</div></div>
    `;
    document.getElementById('detailSigninCode').textContent = r.signinCode || '--';
    // 签到二维码（到店出示给店员核销）
    document.getElementById('detailQr').src = '/api/qrcode/' + encodeURIComponent(r.code);
    document.getElementById('detailStatus').innerHTML =
      r.status === 'checked_in'
        ? '<div class="tip-title">已签到</div><p>您已到店签到，请耐心等待工作人员安排体验。</p>'
        : r.status === 'cancelled'
        ? '<div class="tip-title">已取消</div><p>该预约已取消。如需体验请重新预约。</p>'
        : `<div class="tip-title">温馨提示</div><p>到店后由店员为您签到。请提前5-10分钟到店，凭预约码或签到验证码核销。期待您在${escapeHtml(r.storeName)}有美好的体验。</p>`;
  } catch (e) {
    grid.innerHTML = '<div class="info-item"><div class="info-label">提示</div><div class="info-value">加载失败，请检查网络后重试</div></div>';
    document.getElementById('detailCodeRow').style.display = 'none';
  }
}

function goReservePage() {
  location.href = '/';
}

/* ============ 我的预约（按手机号查询） ============ */
function showLookup() {
  document.getElementById('panel-reserve').style.display = 'none';
  document.getElementById('panel-success').style.display = 'none';
  document.getElementById('panel-detail').style.display = 'none';
  document.getElementById('panel-lookup').style.display = '';
  document.getElementById('lookupResult').innerHTML = '';
  hideError('lookupError');
  setTimeout(() => document.getElementById('lookupPhone').focus(), 100);
}

function backToReserve() {
  document.getElementById('panel-lookup').style.display = 'none';
  document.getElementById('panel-reserve').style.display = '';
}

async function doLookup() {
  const phone = document.getElementById('lookupPhone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) return showError('lookupError', '请输入正确的11位手机号');
  hideError('lookupError');
  const btn = document.getElementById('btnLookup');
  btn.disabled = true; btn.textContent = '查询中…';
  const box = document.getElementById('lookupResult');
  box.innerHTML = '<div class="info-item"><div class="info-label">查询中</div><div class="info-value">--</div></div>';
  try {
    const res = await fetch(withStore('/api/customer/reservations?phone=' + encodeURIComponent(phone)));
    const d = await res.json();
    if (!res.ok) { box.innerHTML = `<div class="success-tip"><p>${escapeHtml(d.error || '查询失败')}</p></div>`; return; }
    const list = d.reservations || [];
    if (!list.length) {
      box.innerHTML = '<div class="success-tip"><p>该手机号暂无预约记录</p></div>';
      return;
    }
    const statusText = { pending: '待签到', checked_in: '已签到', cancelled: '已取消' };
    box.innerHTML = list.map(r => `
      <div class="lookup-card" style="border:1px solid #eee;border-radius:12px;padding:14px;margin-bottom:12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <strong>${escapeHtml(r.storeName || '门店预约')}</strong>
          <span class="status-tag ${r.status}">${statusText[r.status] || escapeHtml(r.status)}</span>
        </div>
        <div style="font-size:13px;color:#666;line-height:1.9;">
          ${escapeHtml(r.date)} · ${escapeHtml(r.timeSlot)} · ${r.partySize}人 · 排队第${r.queueNumber}位<br>
          姓名 ${escapeHtml(r.name)} · 手机 ${escapeHtml(r.phone)}
        </div>
        <div style="margin-top:10px;">
          <button class="btn btn-sm btn-outline" onclick="location.href='/?code=${encodeURIComponent(r.code)}'">查看详情 & 二维码</button>
        </div>
      </div>`).join('');
  } catch (e) {
    box.innerHTML = '<div class="success-tip"><p>网络异常，请重试</p></div>';
  } finally {
    btn.disabled = false; btn.textContent = '查询';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('lookupPhone').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLookup();
  });
});

async function loadSettings() {
  try {
    const res = await fetch(withStore('/api/settings'));
    const d = await res.json();
    // 大标题 = 活动名称；小字 = 门店名称（+地址）
    document.getElementById('storeName').textContent = (d.activity && d.activity.title) || d.storeName;
    const addr = (d.activity && d.activity.address) || d.storeAddress || '';
    document.getElementById('storeAddr').textContent = d.storeName + (addr ? ' · ' + addr : '');
    activities = d.activities || [];
    storePhone = d.contact || d.storePhone || ''; // 活动联系方式优先，默认门店电话
    renderContactPhone();
    applyBackground(d.activity && d.activity.background);
    // 活动选择器（多活动时显示）
    renderActivityPicker();
    if (activityCode) {
      const hit = activities.find(a => a.id === activityCode);
      if (!hit) activityCode = '';
    }
  } catch (e) { /* ignore */ }
}

// 活动选择：一店多活动时顾客先选活动
function renderActivityPicker() {
  const wrap = document.getElementById('activityPicker');
  if (!wrap) return;
  const enabled = activities.filter(a => a.enabled !== false);
  if (enabled.length <= 1) { wrap.style.display = 'none'; return; }
  if (!activityCode) activityCode = enabled[0].id;
  wrap.style.display = '';
  wrap.innerHTML = '<div class="form-label">选择活动</div><div class="activity-tabs">' +
    enabled.map(a => `<button class="activity-tab ${a.id === activityCode ? 'active' : ''}" onclick="switchActivity('${a.id}')">${escapeHtml(a.title)}</button>`).join('') +
    '</div>';
}

async function switchActivity(id) {
  activityCode = id;
  renderActivityPicker();
  const d = await (await fetch(withStore('/api/settings'))).json();
  storePhone = d.contact || d.storePhone || '';
  renderContactPhone();
  document.getElementById('storeName').textContent = (d.activity && d.activity.title) || d.storeName;
  const addr = (d.activity && d.activity.address) || d.storeAddress || '';
  document.getElementById('storeAddr').textContent = d.storeName + (addr ? ' · ' + addr : '');
  applyBackground(d.activity && d.activity.background);
  await loadSlots();
}

function buildDatePicker() {
  const picker = document.getElementById('datePicker');
  picker.innerHTML = `
    <div class="form-label">选择日期</div>
    <div class="calendar">
      <div class="cal-header">
        <button class="cal-nav" id="calPrev">&lsaquo;</button>
        <span class="cal-title" id="calTitle"></span>
        <button class="cal-nav" id="calNext">&rsaquo;</button>
      </div>
      <div class="cal-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  `;
  document.getElementById('calPrev').onclick = () => changeMonth(-1);
  document.getElementById('calNext').onclick = () => changeMonth(1);
  renderCalendar();
}

let calYear, calMonth;
const today = new Date();
today.setHours(0, 0, 0, 0);
const maxDate = new Date(today);
maxDate.setDate(maxDate.getDate() + 14);

function changeMonth(delta) {
  const d = new Date(calYear, calMonth + delta, 1);
  calYear = d.getFullYear();
  calMonth = d.getMonth();
  renderCalendar();
}

function formatDate(y, m, d) {
  return y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
}

function renderCalendar() {
  if (calYear === undefined) {
    calYear = today.getFullYear();
    calMonth = today.getMonth();
  }

  document.getElementById('calTitle').textContent = calYear + '年 ' + (calMonth + 1) + '月';

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';

  // Empty cells before first day
  for (let i = 0; i < firstDay; i++) {
    grid.appendChild(createDayCell('', 'cal-empty'));
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = formatDate(calYear, calMonth, d);
    const cellDate = new Date(calYear, calMonth, d);
    const cls = [];

    if (cellDate < today || cellDate > maxDate) cls.push('cal-disabled');
    if (cellDate.getTime() === today.getTime()) cls.push('cal-today');
    if (dateStr === currentDate) cls.push('cal-active');

    const cell = createDayCell(d, cls.join(' '));
    if (!cls.includes('cal-disabled')) {
      cell.onclick = () => selectCalendarDate(dateStr, cell);
    }
    grid.appendChild(cell);
  }
}

function createDayCell(text, className) {
  const el = document.createElement('div');
  el.className = 'cal-day' + (className ? ' ' + className : '');
  el.textContent = text;
  return el;
}

async function selectCalendarDate(ds, el) {
  currentDate = ds;
  document.querySelectorAll('.cal-day.cal-active').forEach(e => e.classList.remove('cal-active'));
  el.classList.add('cal-active');
  selectedSlot = null;
  await loadSlots();
}

async function loadSlots() {
  const sel = document.getElementById('slotSelect');
  sel.innerHTML = '<option value="">加载中…</option>';
  selectedSlot = null;

  try {
    const res = await fetch(withStore('/api/slots?date=' + currentDate));
    const data = await res.json();

    if (!data.slots || data.slots.length === 0) {
      sel.innerHTML = '<option value="">该日期暂无可用时段</option>';
      return;
    }
    // 后端已过滤：只返回未约满且未过时间的时段，直接展示，不带余量文字
    sel.innerHTML = '<option value="">请选择时段</option>' +
      data.slots.map(s => `<option value="${s.slot}">${s.slot}</option>`).join('');

    sel.onchange = function() {
      selectedSlot = this.value || null;
    };
  } catch (e) {
    sel.innerHTML = '<option value="">加载失败</option>';
  }
}

function togglePartyOther() {
  const sel = document.getElementById('inputParty');
  const other = document.getElementById('inputPartyOther');
  other.style.display = sel.value === 'other' ? '' : 'none';
}

/* ============ 预约提交 ============ */
async function doReserve() {
  if (!selectedSlot) return showError('reserveError', '请选择时段');
  const name = document.getElementById('inputName').value.trim();
  const phone = document.getElementById('inputPhone').value.trim();
  let partySize = document.getElementById('inputParty').value;
  if (partySize === 'other') {
    partySize = parseInt(document.getElementById('inputPartyOther').value) || 0;
    if (partySize < 1) return showError('reserveError', '请填写正确的体验人数');
  } else {
    partySize = parseInt(partySize);
  }
  if (!name) return showError('reserveError', '请输入姓名');
  if (!/^1[3-9]\d{9}$/.test(phone)) return showError('reserveError', '手机号格式不正确');

  const btn = document.getElementById('btnReserve');
  btn.disabled = true;
  btn.textContent = '提交中…';
  hideError('reserveError');

  try {
    const res = await fetch('/api/reserve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, phone, partySize, date: currentDate, timeSlot: selectedSlot, store: storeCode || undefined, act: activityCode || undefined })
    });
    const data = await res.json();

    if (!res.ok) {
      showError('reserveError', data.error);
      btn.disabled = false;
      btn.textContent = '提交预约';
      return;
    }

    showSuccess(data.reservation);
  } catch (e) {
    showError('reserveError', '网络异常，请重试');
  }

  btn.disabled = false;
  btn.textContent = '提交预约';
}

function showSuccess(r) {
  // 隐藏预约面板，显示成功面板
  document.getElementById('panel-reserve').style.display = 'none';
  const panel = document.getElementById('panel-success');
  panel.style.display = '';
  successCode = r.code;

  document.getElementById('successReserveCode').textContent = r.code;

  document.getElementById('successGrid').innerHTML = `
    <div class="info-item"><div class="info-label">姓名</div><div class="info-value">${escapeHtml(r.name)}</div></div>
    <div class="info-item"><div class="info-label">人数</div><div class="info-value">${r.partySize}人</div></div>
    <div class="info-item"><div class="info-label">日期</div><div class="info-value">${escapeHtml(r.date)}</div></div>
    <div class="info-item"><div class="info-label">时段</div><div class="info-value">${escapeHtml(r.timeSlot)}</div></div>
  `;

  document.getElementById('successTip').innerHTML = `
    <div class="tip-title">温馨提示</div>
    <p>预约成功！请按预约时间到店，到店后由店员为您核销签到。可在「我的预约」中查看预约码和签到凭证。希望您在${escapeHtml(r.storeName)}有美好的体验。</p>
  `;

  panel.scrollIntoView({ behavior: 'smooth' });
  renderOtherActivities(r.activityId, r.storeCode);

  // 清理表单
  document.getElementById('inputName').value = '';
  document.getElementById('inputPhone').value = '';
  selectedSlot = null;
}

// 预约成功后：弹出本店其他活动（可一键切换去预约）
async function renderOtherActivities(bookedActId, storeCode) {
  const box = document.getElementById('otherActivities');
  if (!box) return;
  box.innerHTML = '';
  try {
    const res = await fetch(withStore('/api/settings'));
    const d = await res.json();
    const others = (d.activities || []).filter(a => a.enabled !== false && a.id !== bookedActId);
    if (!others.length) return;
    box.innerHTML = '<div class="tip-title">🏪 本店还有其他活动可预约</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">' +
      others.map(a => `<button class="btn btn-sm btn-outline" onclick="goOtherActivity('${a.id}')">${escapeHtml(a.title)}</button>`).join('') +
      '</div>';
  } catch (e) { /* ignore */ }
}

// 切换去其他活动预约
async function goOtherActivity(id) {
  activityCode = id;
  renderActivityPicker();
  document.getElementById('panel-success').style.display = 'none';
  document.getElementById('panel-reserve').style.display = '';
  const d = await (await fetch(withStore('/api/settings'))).json();
  document.getElementById('storeName').textContent = (d.activity && d.activity.title) || d.storeName;
  document.getElementById('storeAddr').textContent = (d.activity && d.activity.address) || '';
  await loadSlots();
  document.getElementById('panel-reserve').scrollIntoView({ behavior: 'smooth' });
}

function resetReserve() {
  document.getElementById('panel-success').style.display = 'none';
  document.getElementById('panel-reserve').style.display = '';
  document.getElementById('panel-reserve').scrollIntoView({ behavior: 'smooth' });
  loadSlots();
}

// 查看当前预约详情（跳转 /?code=X 只读页）
function viewMyReservation() {
  if (!successCode) return;
  location.href = '/?code=' + encodeURIComponent(successCode);
}

/* ============ 工具 ============ */
function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
}

function hideError(id) {
  document.getElementById(id).classList.remove('show');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
